# Install as an sshd_config.d drop-in, validate with sshd -t, then reload SSH.
# The dedicated key must also restrict permitlisten to this loopback port.
Match User palettewow-tunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:18081
    PermitOpen none
    GatewayPorts no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
Match all
